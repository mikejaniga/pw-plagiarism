[project]
name = "plagiarism-detector"
version = "0.1.0"
description = "Plagiarism Detection System with Language Model Fusion (NLP Ensemble)"
readme = {file = "README.org", content-type = "text/plain"}
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.7.1",
    "numpy>=1.24.0",
    "openpyxl>=3.1.2",
    "scikit-learn>=1.2.0",
    "seaborn>=0.12.2",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
plagiarism-detector = "plagiarism_detector.main:main"
